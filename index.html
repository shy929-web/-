<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사진 촬영 스튜디오</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #263b72, #0b1020 58%); color: #f7f8ff; padding: 24px; }
    main { width: min(100%, 720px); }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 3rem); }
    header p { margin: 0; color: #b7c1e5; }
    .card { background: rgba(16, 23, 48, .86); border: 1px solid rgba(255,255,255,.12); border-radius: 24px; padding: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.3); backdrop-filter: blur(16px); }
    .stage { position: relative; overflow: hidden; aspect-ratio: 4 / 3; border-radius: 16px; background: #050812; display: grid; place-items: center; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
    canvas { display: none; }
    .empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; color: #aeb9dd; }
    .empty[hidden] { display: none; }
    .status { min-height: 24px; margin: 14px 2px 0; color: #c7d1f4; text-align: center; font-size: .95rem; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    button, a.button { border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .15s, filter .15s; }
    button:hover, a.button:hover { transform: translateY(-1px); filter: brightness(1.08); }
    button:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    .primary { background: #6c7cff; color: white; }
    .secondary { background: #27345d; color: #eef1ff; }
    .success { background: #28b98a; color: #061c16; }
    .note { margin: 16px 4px 0; color: #8995bd; font-size: .82rem; text-align: center; line-height: 1.5; }
    .community { margin-top: 20px; }
    .community-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .community h2 { margin: 0; font-size: 1.25rem; }
    .posts { display: grid; gap: 10px; }
    .post { padding: 14px; border-radius: 14px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08); }
    .post-title { margin: 0 0 6px; font-weight: 800; }
    .post-meta { color: #8f9bc2; font-size: .78rem; }
    .post-actions { margin-top: 10px; }
    .post-actions a { color: #b8c3ff; font-size: .82rem; }
    .post-body { margin: 8px 0 0; white-space: pre-wrap; color: #dce2ff; line-height: 1.45; }
    .comment-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
    .comment-box label { display: block; margin-bottom: 6px; color: #c7d1f4; font-size: .85rem; font-weight: 700; }
    .comment-box textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 10px 12px; background: rgba(3,7,20,.55); color: #f7f8ff; font: inherit; line-height: 1.45; }
    .comment-box textarea:focus { outline: 2px solid #6c7cff; outline-offset: 1px; }
    .comment-box .comment-submit { margin-top: 8px; padding: 9px 14px; font-size: .86rem; }
    .empty-posts { color: #aeb9dd; text-align: center; padding: 18px 8px; }
    .map { display: none; height: 230px; margin-top: 14px; border-radius: 14px; overflow: hidden; }
    .map.visible { display: block; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>사진 촬영 스튜디오</h1>
      <p>카메라를 켜고 마음에 드는 순간을 남겨보세요.</p>
    </header>
    <section class="card" aria-label="사진 촬영 영역">
      <div class="stage">
        <video id="camera" autoplay playsinline muted aria-label="카메라 미리보기"></video>
        <canvas id="photo" aria-label="촬영한 사진"></canvas>
        <div class="empty" id="empty">카메라 시작 버튼을 누르면 촬영 화면이 열립니다.</div>
      </div>
      <div class="map" id="map" aria-label="촬영 위치 지도"></div>
      <p class="status" id="status" role="status">카메라를 시작할 준비가 되었습니다.</p>
      <div class="actions">
        <button class="primary" id="start">카메라 시작</button>
        <button class="primary" id="capture" disabled>사진 찍기</button>
        <button class="secondary" id="retake" disabled>다시 찍기</button>
        <a class="button success" id="download" download="my-photo.png" hidden>사진 다운로드</a>
        <button class="secondary" id="postPhoto" disabled>게시판에 올리기</button>
        <button class="secondary" id="location" disabled>촬영 위치 표시</button>
        <button class="secondary" id="busanMap">부산 지도 보기</button>
      </div>
      <p class="note">카메라 권한이 필요합니다. 모바일에서는 HTTPS 또는 localhost 환경에서 사용할 수 있습니다.</p>
    </section>
    <section class="card community" aria-label="커뮤니티 게시판">
      <div class="community-head">
        <div>
          <h2>사진 커뮤니티</h2>
          <p class="note" style="text-align:left; margin:4px 0 0">모든 방문자가 함께 보는 공개 게시판입니다.</p>
        </div>
        <div class="actions" style="margin-top:0">
          <button class="secondary" id="refreshPosts">새로고침</button>
          <a class="button secondary" href="https://github.com/shy929-web/-/issues/new" target="_blank" rel="noopener">게시글 작성</a>
        </div>
      </div>
      <div class="posts" id="posts" aria-live="polite"><div class="empty-posts">게시글을 불러오는 중입니다…</div></div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const video = document.querySelector('#camera');
    const canvas = document.querySelector('#photo');
    const empty = document.querySelector('#empty');
    const status = document.querySelector('#status');
    const startButton = document.querySelector('#start');
    const captureButton = document.querySelector('#capture');
    const retakeButton = document.querySelector('#retake');
    const downloadLink = document.querySelector('#download');
    const postPhotoButton = document.querySelector('#postPhoto');
    const locationButton = document.querySelector('#location');
    const busanMapButton = document.querySelector('#busanMap');
    const mapElement = document.querySelector('#map');
    let map;
    let marker;
    let stream;
    const posts = document.querySelector('#posts');
    const refreshPostsButton = document.querySelector('#refreshPosts');

    function setStatus(message) { status.textContent = message; }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus('이 브라우저에서는 카메라 기능을 사용할 수 없습니다.');
        return;
      }
      try {
        stream?.getTracks().forEach(track => track.stop());
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
        video.srcObject = stream;
        video.style.display = 'block';
        canvas.style.display = 'none';
        empty.hidden = true;
        captureButton.disabled = false;
        retakeButton.disabled = true;
        downloadLink.hidden = true;
        setStatus('카메라가 켜졌습니다. 사진 찍기 버튼을 눌러보세요.');
      } catch (error) {
        setStatus(error.name === 'NotAllowedError' ? '카메라 권한을 허용해 주세요.' : '카메라를 시작할 수 없습니다.');
      }
    }

    function capturePhoto() {
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const context = canvas.getContext('2d');
      context.save();
      context.scale(-1, 1);
      context.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
      context.restore();
      video.style.display = 'none';
      canvas.style.display = 'block';
      retakeButton.disabled = false;
      captureButton.disabled = true;
      downloadLink.href = canvas.toDataURL('image/png');
      downloadLink.hidden = false;
      postPhotoButton.disabled = false;
      locationButton.disabled = false;
      setStatus('사진을 촬영했습니다. 다운로드하거나 다시 찍어보세요.');
    }

    function showLocation() {
      if (!navigator.geolocation) {
        setStatus('이 브라우저에서는 GPS 위치 기능을 사용할 수 없습니다.');
        return;
      }
      setStatus('촬영 위치를 확인하는 중입니다. 위치 권한을 허용해 주세요.');
      navigator.geolocation.getCurrentPosition(({ coords }) => {
        const { latitude, longitude, accuracy } = coords;
        mapElement.classList.add('visible');
        if (!map) {
          map = L.map(mapElement).setView([latitude, longitude], 16);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
        } else {
          map.setView([latitude, longitude], 16);
        }
        marker?.remove();
        marker = L.marker([latitude, longitude]).addTo(map)
          .bindPopup(`촬영 위치<br>위도 ${latitude.toFixed(5)}, 경도 ${longitude.toFixed(5)}<br>정확도 약 ${Math.round(accuracy)}m`)
          .openPopup();
        setStatus(`촬영 위치를 지도에 표시했습니다. (정확도 약 ${Math.round(accuracy)}m)`);
      }, (error) => {
        setStatus(error.code === 1 ? '위치 권한을 허용해야 지도에 표시할 수 있습니다.' : '현재 위치를 확인할 수 없습니다.');
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
    }

    function showBusanMap() {
      const busan = [35.1796, 129.0756];
      mapElement.classList.add('visible');
      if (!map) {
        map = L.map(mapElement).setView(busan, 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
      } else {
        map.setView(busan, 11);
      }
      marker?.remove();
      marker = L.marker(busan).addTo(map).bindPopup('부산 중심 지도').openPopup();
      setStatus('부산 지도를 표시했습니다. GPS 권한을 허용하면 현재 위치도 표시합니다.');
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(({ coords }) => {
          marker?.remove();
          marker = L.marker([coords.latitude, coords.longitude]).addTo(map)
            .bindPopup(`현재 GPS 위치<br>위도 ${coords.latitude.toFixed(5)}, 경도 ${coords.longitude.toFixed(5)}`)
            .openPopup();
          map.setView([coords.latitude, coords.longitude], 13);
          setStatus('GPS로 현재 위치를 부산 지도에 표시했습니다.');
        }, () => {}, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
      }
    }

    function postPhoto() {
      const link = document.createElement('a');
      link.href = downloadLink.href;
      link.download = `community-photo-${Date.now()}.png`;
      link.click();
      window.open('https://github.com/shy929-web/-/issues/new?title=%EC%82%AC%EC%A7%84%20%EA%B2%8C%EC%8B%9C%EA%B8%80', '_blank', 'noopener');
      setStatus('사진을 저장했습니다. 열린 GitHub 게시글 화면에서 사진을 첨부해 등록해 주세요.');
    }

    startButton.addEventListener('click', startCamera);
    captureButton.addEventListener('click', capturePhoto);
    retakeButton.addEventListener('click', startCamera);
    postPhotoButton.addEventListener('click', postPhoto);
    locationButton.addEventListener('click', showLocation);
    busanMapButton.addEventListener('click', showBusanMap);
    window.addEventListener('beforeunload', () => stream?.getTracks().forEach(track => track.stop()));

    async function loadCommunityPosts() {
      try {
        const response = await fetch('https://api.github.com/repos/shy929-web/-/issues?state=open&per_page=20');
        if (!response.ok) throw new Error('게시글을 불러오지 못했습니다.');
        const issues = (await response.json()).filter(issue => !issue.pull_request);
        if (!issues.length) {
          posts.innerHTML = '<div class="empty-posts">아직 게시글이 없습니다. 첫 게시글을 남겨보세요!</div>';
          return;
        }
        posts.innerHTML = issues.map(issue => `
          <article class="post">
            <h3 class="post-title"><a href="${issue.html_url}" target="_blank" rel="noopener">${escapeHtml(issue.title)}</a></h3>
            <div class="post-meta">${escapeHtml(issue.user.login)} · ${new Date(issue.created_at).toLocaleDateString('ko-KR')}</div>
            <p class="post-body">${escapeHtml(issue.body || '내용이 없습니다.')}</p>
            <div class="post-actions">
              <a href="${issue.html_url}" target="_blank" rel="noopener">게시글 보기 · 댓글 ${issue.comments || 0}개</a>
              <span aria-hidden="true"> · </span>
              <a href="${issue.html_url}#issuecomment-new" target="_blank" rel="noopener">댓글 달기</a>
              <span aria-hidden="true"> · </span>
              <a href="${issue.html_url}" target="_blank" rel="noopener">내 게시글 삭제/닫기</a>
            </div>
            <div class="comment-box">
              <label for="comment-${issue.number}">댓글 작성</label>
              <textarea id="comment-${issue.number}" class="comment-input" data-issue-url="${issue.html_url}" placeholder="이 게시글에 댓글을 입력하세요."></textarea>
              <button class="primary comment-submit" type="button" data-issue-url="${issue.html_url}">GitHub에서 댓글 작성</button>
            </div>
          </article>`).join('');
      } catch (error) {
        posts.innerHTML = '<div class="empty-posts">게시글을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.</div>';
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character]));
    }

    refreshPostsButton.addEventListener('click', loadCommunityPosts);
    posts.addEventListener('click', async (event) => {
      const button = event.target.closest('.comment-submit');
      if (!button) return;
      const card = button.closest('.post');
      const input = card?.querySelector('.comment-input');
      const comment = input?.value.trim();
      if (!comment) {
        input?.focus();
        setStatus('댓글 내용을 먼저 입력해 주세요.');
        return;
      }
      try {
        await navigator.clipboard.writeText(comment);
        setStatus('댓글 내용을 복사했습니다. GitHub 댓글 입력칸에 붙여넣고 등록해 주세요.');
      } catch {
        setStatus('댓글 내용을 준비했습니다. GitHub에서 댓글을 등록해 주세요.');
      }
      window.open(`${button.dataset.issueUrl}#issuecomment-new`, '_blank', 'noopener');
    });
    window.addEventListener('focus', loadCommunityPosts);
    loadCommunityPosts();
  </script>
</body>
</html>
